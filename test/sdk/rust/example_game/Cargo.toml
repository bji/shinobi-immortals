# An example of a game program that uses Shinobi Immortals as game pieces, built with the standard Solana crates.
# run_tests.sh builds it (with cargo build-sbf) to check that the crate builds for the Solana target.  See src/lib.rs.
[package]
name = "shinobi-immortals-example-game"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = [ "cdylib" ]

[dependencies]
shinobi-immortals = { path = "../../../../sdk/rust" }
solana-account-info = "3.1"
solana-address = "2.2"
solana-cpi = "3"
solana-program-entrypoint = "3"
solana-program-error = "3"

[lints.rust.unexpected_cfgs]
level = "warn"
# The entrypoint macro of solana-program-entrypoint refers to these features of the program that uses it
check-cfg = [ 'cfg(target_os, values("solana"))', 'cfg(feature, values("custom-heap", "custom-panic"))' ]

# Not part of the test crate's workspace
[workspace]
